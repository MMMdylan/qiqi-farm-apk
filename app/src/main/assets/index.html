<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>琪琪宝贝专属农场助手</title>
<style>
/* 数字和英文用圆体 Nunito（只含拉丁字符，许可见 fonts/OFL.txt），中文用手机自带字体 */
@font-face{font-family:"Nunito";src:url(fonts/nunito-latin.woff2) format("woff2");font-weight:200 1000;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
    --paper:#FFF8EF;--paper-2:#FCEEDC;--card:#FFFDFA;--line:#F1E3CF;--line-2:#E6D2B8;
    --cocoa:#553F2F;--cocoa-2:#8A7260;--cocoa-3:#B5A08C;
    --apricot:#F28C55;--apricot-d:#D46A33;--apricot-l:#FFE8D8;
    --honey-l:#FFF2CE;--honey-ink:#80602C;
    --blush-l:#FDE5E1;--blush-ink:#C0625A;
    --peach-l:#FFEBD6;
    --sage:#7DB065;--sage-d:#4F8A3B;--sage-l:#E4F1D8;
    --water:#4DA3D1;--water-d:#2C81B0;--water-l:#DFF0F9;
    --berry:#D65A62;--berry-d:#B6434B;--berry-l:#FCE2E1;
    --wood-d:#9A6A42;
    --font:"Nunito","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    --shadow:0 12px 24px -16px rgba(140,90,40,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(320px 190px at 100% 190px,rgba(255,222,190,.8),rgba(255,222,190,0)) no-repeat;font-family:var(--font);font-size:15px;color:var(--cocoa);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{margin:0;-webkit-appearance:none}

.app{max-width:520px;margin:0 auto;padding:8px 0 112px}
body.typing .app{padding-bottom:24px}

/* 时长：数字大、单位小 */
.dur{font-weight:800;white-space:nowrap}
.dur b{margin:0 1px;font-size:1.45em;font-weight:900;letter-spacing:.3px}
.tilde{margin:0 .2em;font-size:.7em;font-weight:800;opacity:.75}

/* ===== 小院首页 ===== */
.home-head{display:flex;align-items:center;gap:12px;padding:12px 20px 18px}
.hh-text{flex:1;min-width:0}
.hello{font-size:14px;font-weight:800;color:var(--cocoa-2)}
.sign{position:relative;display:inline-block;margin:8px 0 9px;padding:7px 22px 8px;border-radius:12px;background:repeating-linear-gradient(177deg,rgba(255,255,255,.08) 0 3px,rgba(90,50,20,.04) 3px 7px),linear-gradient(#DBA878,#C38B5B);font-size:22px;font-weight:900;letter-spacing:3px;color:#FFF7EA;text-shadow:0 1px 0 rgba(110,60,20,.45);white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(120,70,30,.16),0 3px 0 var(--wood-d)}
.sign::before,.sign::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#8C5E38;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sign::before{left:8px}
.sign::after{right:8px}
.today{font-size:13px;font-weight:700;color:var(--cocoa-2)}
.today b{color:var(--sage-d)}
.avatar{flex:none;width:66px;height:66px;border-radius:22px;object-fit:cover;box-shadow:0 0 0 3px #fff,0 8px 16px -6px rgba(120,80,40,.5);transform:rotate(4deg)}

.hero{position:relative;overflow:hidden;margin:0 16px 18px;padding:16px 18px;border-radius:26px;background:linear-gradient(145deg,#FFE3C8,#FFC49E);box-shadow:0 14px 26px -14px rgba(214,106,51,.65)}
.hero-eyebrow{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900;color:#B0703F}
.hero-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.hero-eyebrow.now{color:var(--apricot-d)}
.hero-eyebrow.now::before{opacity:1;animation:pulse 1.6s ease-out infinite}
.hero-art{position:absolute;top:34px;right:10px;width:76px;height:76px;transform:rotate(-8deg);pointer-events:none}
.hero-emoji{display:flex;align-items:center;justify-content:center;font-size:54px;line-height:1}
.hero-title,.hero-time,.hero-sub,.hero-foot{position:relative}
.hero-title{margin-top:9px;padding-right:84px;font-size:17px;font-weight:700}
.hero-title b{display:inline-block;max-width:9em;overflow:hidden;font-weight:900;white-space:nowrap;text-overflow:ellipsis;vertical-align:bottom}
.hero-time{margin-top:1px;font-size:clamp(28px,8.4vw,34px);font-weight:900;line-height:1.15;letter-spacing:.5px;white-space:nowrap}
.hero-time small{margin-right:4px;font-size:16px;font-weight:900;color:#A27458}
.hero-sub{margin-top:2px;font-size:13px;font-weight:700;color:#7A5A44}
.hero-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:13px}
.hero-pill{padding:5px 12px;border-radius:999px;background:#FFFCF8;font-size:13px;font-weight:800;color:var(--apricot-d)}
.hero-pill .dur b{font-size:1.3em}
.hero-then{font-size:12.5px;font-weight:700;color:#8A6A52}
.hero .more{position:absolute;z-index:1;top:10px;right:10px;color:#B0805C}
.hero .toggle{color:#8A6A52}
.hero .detail{background:rgba(255,255,255,.55)}

.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border:1px solid var(--line-2);border-radius:999px;background:var(--card);font-size:13px;font-weight:800;color:var(--cocoa-2)}
.chip i{margin-left:3px;font-style:normal;color:var(--cocoa-3)}
.chip.on{border-color:var(--cocoa);background:var(--cocoa);color:#FFF6EA}
.chip.on i{color:#E2C6AC}

.rec{display:flex;gap:12px;margin:0 16px 12px;padding:14px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 10px 20px -14px rgba(140,90,40,.4)}
.rec[data-key]{cursor:pointer}
.badge-ic{flex:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:16px;font-size:24px}
.b-blush{background:var(--blush-l)}
.b-peach{background:var(--peach-l)}
.b-water{background:var(--water-l)}
.b-sage{background:var(--sage-l)}
.b-honey{background:var(--honey-l)}
.rec-body{flex:1;min-width:0}
.rec-top{display:flex;align-items:center;gap:6px}
.rec-name{min-width:0;overflow:hidden;font-size:16px;font-weight:900;white-space:nowrap;text-overflow:ellipsis}
.kind{flex:none;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:800}
.k-apricot{background:var(--apricot-l);color:var(--apricot-d)}
.k-water{background:var(--water-l);color:var(--water-d)}
.k-sage{background:var(--sage-l);color:var(--sage-d)}
.k-honey{background:var(--honey-l);color:var(--honey-ink)}
.more{flex:none;width:32px;height:28px;margin:-4px -6px -4px auto;padding:0;border:0;border-radius:10px;background:none;font-size:18px;font-weight:900;line-height:1;color:var(--cocoa-3)}
.more:active{background:rgba(85,63,47,.08)}
.rec-main{margin-top:3px;font-size:13.5px;font-weight:700;color:var(--cocoa-2)}
.rec-main .dur{color:var(--apricot-d)}
.rec-sub{margin-top:2px;font-size:12.5px;font-weight:700;color:var(--cocoa-3)}
.clock{font-size:20px;font-weight:900;color:var(--water-d)}
.clock small{margin-right:3px;font-size:13px}
.bar{position:relative;height:8px;margin:10px 12px 4px 0;border-radius:99px;background:var(--paper-2)}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:linear-gradient(90deg,#BCDD98,var(--sage))}
.bar i::after{content:"🌱";position:absolute;top:50%;right:-10px;font-size:16px;font-style:normal;transform:translateY(-58%)}
.rec.ripe{border-color:#D3E7BF;background:linear-gradient(135deg,#F1F9E7,#FFFDFA 70%)}
.rec.ripe .rec-main{font-size:15px;font-weight:900;color:var(--sage-d)}
.rec.ripe .bar i::after{content:"🌾"}
.rec.finished{opacity:.72}
.done-text{font-size:15px;font-weight:900;color:var(--sage-d)}

.mini-steps{display:flex;margin:10px 0 0;padding:0;list-style:none}
.mini-steps li{position:relative;flex:1;min-width:0;padding-top:15px;font-size:11px;font-weight:700;text-align:center;color:var(--cocoa-3)}
.mini-steps li::before{content:"";position:absolute;z-index:1;top:0;left:50%;width:11px;height:11px;margin-left:-5.5px;border:2px solid var(--line-2);border-radius:50%;background:var(--paper);box-sizing:border-box}
.mini-steps li::after{content:"";position:absolute;top:4.5px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.mini-steps li:first-child::after{display:none}
.mini-steps li.done{color:var(--cocoa-2)}
.mini-steps li.done::before{border-color:var(--sage);background:var(--sage)}
.mini-steps li.done::after,.mini-steps li.next::after{background:var(--sage)}
.mini-steps li.next{font-weight:900;color:var(--water-d)}
.mini-steps li.next::before{border-color:var(--water);background:#fff;box-shadow:0 0 0 3px var(--water-l)}

.toggle{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:0;border:0;background:none;font-size:12.5px;font-weight:800;color:var(--cocoa-3)}
.toggle::after{content:"";width:6px;height:6px;margin-top:-4px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.open .toggle::after{margin-top:3px;transform:rotate(-135deg)}
.detail{display:none;margin-top:8px;padding:9px 12px;border-radius:14px;background:var(--paper)}
.open .detail{display:block}
.detail-meta{font-size:12.5px;font-weight:700;line-height:1.9;color:var(--cocoa-3)}
.mini{margin:0;padding:0;list-style:none;font-size:13px;font-weight:700;line-height:1.9;color:var(--cocoa-2)}
.mini .mark{display:inline-block;width:1.3em;color:var(--water-d)}
.mini .passed{color:var(--cocoa-3)}
.mini .passed .mark{color:var(--sage-d)}
.mini .alt{color:var(--cocoa-3)}

.empty{display:flex;flex-direction:column;align-items:center;padding:30px 36px 10px;text-align:center}
.empty svg{width:120px;height:100px}
.empty b{margin-top:6px;font-size:17px;font-weight:900}
.empty span{margin:4px 0 16px;font-size:13px;font-weight:700;line-height:1.6;color:var(--cocoa-2)}
.empty .btn{width:auto;margin:0;padding:0 24px}

/* ===== 计算页 ===== */
.s-head{padding:14px 20px 16px}
.s-title{display:flex;align-items:center;gap:8px;margin:0;font-size:23px;font-weight:900;letter-spacing:1px}
.s-desc{margin:3px 0 0;font-size:13px;font-weight:700;color:var(--cocoa-2)}
.tag-mini{padding:2px 9px;border-radius:999px;background:var(--blush-l);font-size:12px;font-weight:800;letter-spacing:0;color:var(--blush-ink)}

.card{margin:0 16px 14px;padding:16px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow)}
.lbl{display:block;margin:0 0 7px;font-size:13px;font-weight:800;color:var(--cocoa-2)}
.f{margin-bottom:14px}
.inp{display:flex;align-items:center;gap:8px;min-width:0;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);font-size:16px;font-weight:800}
.inp input{flex:1;min-width:0;height:100%;padding:0;border:0;outline:0;background:none;font-weight:800}
.inp input::placeholder{font-weight:700;color:var(--cocoa-3)}
.inp .ico{flex:none;font-size:16px}
.recent{display:flex;align-items:center;gap:6px;margin-top:8px;overflow:hidden;font-size:12px;font-weight:700;white-space:nowrap;color:var(--cocoa-3)}
.recent button{flex:none;max-width:8em;height:26px;overflow:hidden;padding:0 10px;border:1px dashed var(--line-2);border-radius:999px;background:none;font-size:12px;font-weight:800;text-overflow:ellipsis;color:var(--cocoa-2)}

.crop-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crop{position:relative;display:flex;align-items:center;gap:9px;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:18px;background:var(--paper);text-align:left}
.crop .em{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:13px;background:#fff;font-size:21px}
.crop b{display:block;font-size:15px;font-weight:900;white-space:nowrap}
.crop small{display:block;font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--cocoa-3)}
.crop .check{position:absolute;top:-7px;right:-7px;display:none;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;background:var(--apricot);font-size:12px;font-style:normal;font-weight:900;color:#fff;box-shadow:0 0 0 2px var(--card)}
.crop.on{border-color:var(--apricot);background:var(--apricot-l);box-shadow:0 3px 0 #F5C19D}
.crop.on .check{display:flex}
.crop[data-crop=hero].on .em{background:var(--blush-l)}
.crop[data-crop=eco].on .em{background:var(--peach-l)}

.trows{margin-top:14px}
.trows>.field{border-top:1px dashed var(--line-2)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0}
.tlabel{display:flex;align-items:center;gap:9px;min-width:0;font-size:14.5px;font-weight:900}
.tlabel .ti{flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:11px;font-size:16px}
.tlabel small{display:block;font-size:11px;font-weight:700;white-space:nowrap;color:var(--cocoa-3)}
.tcap{flex:none;display:flex;align-items:center;height:50px;padding:0 10px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);font-size:13px;font-weight:800;color:var(--cocoa-2)}
.tcap input{width:44px;height:100%;padding:0;border:0;outline:0;background:none;font-size:26px;font-weight:900;text-align:center;color:var(--cocoa)}
.tcap input::placeholder{color:var(--line-2)}

.goal-chip{display:flex;align-items:center;gap:8px;margin-top:14px;padding:9px 10px 9px 12px;border:1.5px dashed #EBCB7C;border-radius:16px;background:var(--honey-l);font-size:13.5px;font-weight:800;color:var(--honey-ink)}
.goal-chip .dur{margin-left:auto;color:var(--apricot-d)}
.goal-chip .dur b{font-size:1.3em}
.goal-chip button{flex:none;height:28px;padding:0 10px;border:0;border-radius:10px;background:#fff;font-size:12.5px;font-weight:900;color:var(--apricot-d)}
.goal-edit{margin-top:10px}
.goal-row{display:flex;align-items:center;gap:8px}
.goal-row .tcap{flex:1;justify-content:center}

.inp-row{display:flex;gap:8px}
.inp-row .inp{flex:1}
.btn-side{flex:none;height:48px;padding:0 16px;border:1.5px solid var(--line-2);border-radius:16px;background:var(--card);font-size:14px;font-weight:900;color:var(--apricot-d);box-shadow:0 3px 0 var(--line-2)}
.goal-row .btn-side{height:50px}

.inp:focus-within,.tcap:focus-within{border-color:var(--apricot);background:#fff;box-shadow:0 0 0 4px var(--apricot-l)}
.field.err .inp,.field.err .tcap{border-color:var(--berry);background:#FFF6F5;box-shadow:0 0 0 4px var(--berry-l)}
.err-msg{margin:8px 0 2px;padding:8px 12px;border-radius:12px;background:var(--berry-l);font-size:12.5px;font-weight:800;line-height:1.5;color:var(--berry-d)}
.trows .err-msg{margin:-2px 0 11px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:18px;font-size:17px;font-weight:900;letter-spacing:2px}
.btn svg{width:20px;height:20px;fill:rgba(242,140,85,.22);stroke:var(--apricot-d);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{margin-top:16px;background:linear-gradient(#F89E6B,var(--apricot));color:#fff;text-shadow:0 1px 0 rgba(170,70,20,.3);box-shadow:0 4px 0 var(--apricot-d),0 12px 20px -10px rgba(214,106,51,.7)}
.btn.ghost{border:1.5px solid var(--line-2);background:var(--card);color:var(--cocoa);box-shadow:0 3px 0 var(--line-2)}
.btn.danger{background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry-d)}
.btn:active,.btn-side:active,.crop:active{transform:translateY(2px)}
.btn.primary:active{box-shadow:0 2px 0 var(--apricot-d),0 8px 16px -10px rgba(214,106,51,.7)}
.btn.ghost:active,.btn-side:active{box-shadow:0 1px 0 var(--line-2)}
.save{margin:0 16px 14px}

.result{animation:rise .28s ease-out}
.tip{margin:0 16px 14px;padding:12px 16px;border-radius:18px;background:var(--honey-l);font-size:13.5px;font-weight:800;color:var(--honey-ink)}
.warn{padding:14px 16px;border-radius:16px;background:var(--berry-l);font-size:14px;font-weight:700;line-height:1.7;color:#A6404A}
.warn b{font-size:16px;font-weight:900}
.nw{white-space:nowrap}

/* 成熟结果小票 */
.ticket{position:relative;overflow:hidden;margin:0 16px 14px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow)}
.ticket-top{padding:16px 18px}
.t-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--cocoa-3)}
.t-tag{padding:2px 9px;border-radius:999px;font-weight:800}
.t-tag.t-hero{background:var(--blush-l);color:var(--blush-ink)}
.t-tag.t-eco{background:var(--peach-l);color:var(--apricot-d)}
.t-label{margin-top:12px;font-size:13px;font-weight:800;color:var(--cocoa-2)}
.t-big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-top:2px;color:var(--apricot-d)}
.t-big small{font-size:17px;font-weight:900}
.t-big b{font-size:46px;font-weight:900;line-height:1.05;letter-spacing:.5px}
.t-count{margin-top:6px;font-size:13px;font-weight:700;color:var(--cocoa-2)}
.cut{position:relative;margin:0 16px;border-top:2px dashed var(--line-2)}
.cut::before,.cut::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;background:var(--paper)}
.cut::before{left:-28px}
.cut::after{right:-28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 8px 16px}
.stat{min-width:0;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat>span:first-child{display:block;font-size:11.5px;font-weight:800;color:var(--cocoa-3)}
.stat .dur{display:block;margin-top:4px;font-size:11.5px}
.stat .dur b{font-size:19px}

/* 浇水步骤：田间小路 */
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px;font-size:17px;font-weight:900}
.card-h span{font-size:12px;font-weight:800;color:var(--cocoa-3)}
.path{margin:0;padding:0;list-style:none}
.path li{position:relative;display:flex;gap:12px;padding-bottom:18px}
.path li:last-child{padding-bottom:0}
.path li:not(:last-child)::after{content:"";position:absolute;top:44px;bottom:3px;left:19px;border-left:2px dashed var(--line-2)}
.node{flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:14px;background:var(--paper);font-size:20px}
.node svg{width:28px;height:28px}
.node .ic{display:flex;font-style:normal}
.pc{flex:1;min-width:0;padding-top:2px}
.p-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.p-row b{font-size:15px;font-weight:900;white-space:nowrap}
.p-row time{font-size:19px;font-weight:900;white-space:nowrap}
.p-row time small{margin-right:3px;font-size:12px;font-weight:800;color:var(--cocoa-3)}
.pc p{margin:2px 0 0;font-size:12.5px;font-weight:700;line-height:1.6;color:var(--cocoa-2)}
.badge{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:var(--paper-2);font-size:11px;font-style:normal;font-weight:900;line-height:19px;color:var(--cocoa-2);white-space:nowrap}

<script>

// =====================
// 作物规则（时间单位：分钟）
// =====================

const CROPS={
    hero:{ name:"英雄作物", label:"🌸英雄作物", total:1920, maxWater:640, reduce:160 },
    eco:{ name:"经济作物", label:"🍑经济作物", total:960, maxWater:320, reduce:80 }
};

// 计算浇水时间：种下 5 小时后第一次浇水
const FIRST_WATER_AFTER=300;

// 目标剩余时间默认 11小时30分
const DEFAULT_TARGET=690;

const MINUTE=60000;


// 浇水立刻缩短的时间：补进去的水越多缩短越多，从空水浇满缩短 reduce
function waterReduce(crop,water){
    return crop.reduce*(crop.maxWater-water)/crop.maxWater;
}

// 刚种下会自动把空水浇满，剩余成熟时间 = 总时间 - 满额缩短
function plantRemain(crop){
    return crop.total-crop.reduce;
}

// 计算成熟时间：现在浇水缩短多少、浇后剩余，以及之后一直补满水的最快成熟时间
function calcMaturity(crop,remain,water){
    let reduce=waterReduce(crop,water);
    let after=Math.max(remain-reduce,0);
    return {
        reduce:reduce,
        after:after,
        fastest:after/(1+crop.reduce/crop.maxWater)
    };
}

// 浇水策略：从当前状态出发，算出怎样浇水能让浇完后正好剩 target。
// 返回的时间都是"从现在起再过多少分钟"。水干了作物照常长，只是少了补水带来的缩短。
function planStrategy(crop,remain,water,target){
    let rate=crop.reduce/crop.maxWater;
    let afterNow=remain-waterReduce(crop,water);
    if(afterNow<target){
        return { possible:false, afterNow:afterNow };
    }

    // 水一直不干时，浇水每推迟 1 分钟，浇后剩余就少 1+rate 分钟
    let waterAt=(afterNow-target)/(1+rate);
    let plan={ possible:true, afterNow:afterNow, waterAt:waterAt, refills:[], noRefillAt:null };
    if(waterAt<=water){
        return plan;
    }

    // 要等的时间比剩余水分长：中途补水让水一直不干，补水早晚不影响最后浇水的时间。
    // 每次补水不能太早（否则最后浇水前水又会干），也不能太晚（水已经干了）；
    // 只补一次时给出时间范围，要补多次时取范围中间的具体时间。
    let count=Math.ceil((waterAt-water)/crop.maxWater);
    for(let i=1;i<=count;i++){
        let from=Math.max(0,waterAt-(count-i+1)*crop.maxWater);
        let to=water+(i-1)*crop.maxWater;
        plan.refills.push(count===1 ? { from:from, to:to } : { at:(from+to)/2 });
    }

    // 不补水：等水干了再浇一次，这次按满额缩短
    plan.noRefillAt=remain-crop.reduce-target;
    return plan;
}

// 计算浇水时间（英雄作物）：种下 5 小时后第一次浇水，再按浇水策略算第二次浇水
function planWatering(target){
    let crop=CROPS.hero;
    let remain=plantRemain(crop);
    let firstAfter=remain-FIRST_WATER_AFTER-waterReduce(crop,Math.max(crop.maxWater-FIRST_WATER_AFTER,0));
    return {
        plantRemain:remain,
        firstAfter:firstAfter,
        plan:planStrategy(crop,firstAfter,crop.maxWater,target)
    };
}

// 把"从 start 起再过多少分钟"的方案换成具体时间点，最后一次浇水标记为 final
function planToSteps(plan,start,waterTitle,target){
    function at(min){
        return start+Math.round(min*MINUTE);
    }
    let steps=plan.refills.map(function(r){
        return r.at!==undefined
            ? { type:"refill", at:at(r.at) }
            : { type:"refill", from:at(r.from), to:at(r.to) };
    });
    steps.push({ type:"water", title:waterTitle, at:at(plan.waterAt), remain:target, final:true });
    return {
        steps:steps,
        alt:plan.noRefillAt===null ? null : at(plan.noRefillAt)
    };
}

function buildWatering(plantTime,target){
    let r=planWatering(target);
    let record={ possible:r.plan.possible, plantTime:plantTime, target:target, firstAfter:r.firstAfter };
    if(!r.plan.possible){
        return record;
    }
    let firstAt=plantTime+FIRST_WATER_AFTER*MINUTE;
    let rest=planToSteps(r.plan,firstAt,"第二次浇水",target);
    record.steps=[
        { type:"plant", at:plantTime, remain:r.plantRemain },
        { type:"water", title:"第一次浇水", at:firstAt, remain:r.firstAfter }
    ].concat(rest.steps);
    record.alt=rest.alt;
    record.ripeAt=lastStep(record.steps).at+target*MINUTE;
    return record;
}

function buildStrategy(now,remain,water,target){
    let plan=planStrategy(CROPS.hero,remain,water,target);
    let record={ possible:plan.possible, calcTime:now, remain:remain, water:water, target:target, afterNow:plan.afterNow };
    if(!plan.possible){
        return record;
    }
    let rest=planToSteps(plan,now,"浇水",target);
    record.steps=rest.steps;
    record.alt=rest.alt;
    return record;
}



// =====================
// 时间显示
// =====================

function pad2(n){
    return String(n).padStart(2,"0");
}

// 分钟 → "X小时YY分"
function fmtDur(min){
    min=Math.max(Math.round(min),0);
    let h=Math.floor(min/60);
    let m=min%60;
    if(h===0){
        return m+"分";
    }
    return m===0 ? h+"小时" : h+"小时"+pad2(m)+"分";
}

// 分钟 → 数字放大的 "X小时YY分"
function durHtml(min){
    min=Math.max(Math.round(min),0);
    let h=Math.floor(min/60);
    let m=min%60;
    let html=h===0 ? "<b>"+m+"</b>分" : m===0 ? "<b>"+h+"</b>小时" : "<b>"+h+"</b>小时<b>"+pad2(m)+"</b>分";
    return "<span class='dur'>"+html+"</span>";
}

// 毫秒 → 数字放大的倒计时 "X小时YY分ZZ秒"
function countdownHtml(ms){
    let total=Math.max(Math.floor(ms/1000),0);
    let h=Math.floor(total/3600);
    let m=Math.floor(total%3600/60);
    return "<span class='dur'>"+(h>0 ? "<b>"+h+"</b>小时<b>"+pad2(m)+"</b>分" : "<b>"+m+"</b>分")+"<b>"+pad2(total%60)+"</b>秒</span>";
}

// 某个时间点是哪天："今天" / "明天" / "9月17日"
function dayLabel(ms){
    let day=new Date(ms);
    day.setHours(0,0,0,0);
    let today=new Date();
    today.setHours(0,0,0,0);
    let names={ "-1":"昨天", "0":"今天", "1":"明天", "2":"后天" };
    return names[Math.round((day-today)/86400000)] || (day.getMonth()+1)+"月"+day.getDate()+"日";
}

function hhmm(ms){
    let d=new Date(ms);
    return pad2(d.getHours())+":"+pad2(d.getMinutes());
}

function roundMin(ms){
    return Math.round(ms/MINUTE)*MINUTE;
}

// 时间点（取整到分钟）→ "22:16" / "明天 09:46"；showToday 为 true 时今天也写上"今天"
function clock(ms,showToday){
    ms=roundMin(ms);
    let label=dayLabel(ms);
    return label==="今天" && !showToday ? hhmm(ms) : label+" "+hhmm(ms);
}

// 大号时间：不是今天时前面用小字写日期
function timeHtml(ms){
    ms=roundMin(ms);
    let label=dayLabel(ms);
    return (label==="今天" ? "" : "<small>"+label+"</small>")+hhmm(ms);
}

// 大号时间段：两头是同一天时日期只写一次
function rangeHtml(from,to){
    let same=dayLabel(roundMin(from))===dayLabel(roundMin(to));
    return timeHtml(from)+"<span class='tilde'>~</span>"+(same ? hhmm(roundMin(to)) : timeHtml(to));
}

function escapeHtml(value){
    return String(value==null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function toInputTime(ms){
    let d=new Date(ms);
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes());
}



// =====================
// 浇水步骤
// =====================

const NUMS="①②③④⑤⑥⑦⑧⑨⑩";

function stepEnd(step){
    return step.to!==undefined ? step.to : step.at;
}

function stepStart(step){
    return step.from!==undefined ? step.from : step.at;
}

function lastStep(steps){
    return steps[steps.length-1];
}

// 还没做的第一步（种下不算）；到点后一分钟内仍算"就是现在"
function nextStep(steps,now){
    return steps.find(function(step){
        return step.type!=="plant" && stepEnd(step)>=now-MINUTE;
    }) || null;
}

function refillTime(step){
    return step.from!==undefined ? clock(step.from)+" ~ "+clock(step.to) : clock(step.at);
}

// 步骤的简称："种下" / "补水" / "第二次" / "浇水"
function stepLabel(step){
    if(step.type==="plant"){
        return "种下";
    }
    if(step.type==="refill"){
        return "补水";
    }
    return step.title.replace("浇水","") || "浇水";
}

// 展开后的步骤清单；已过的步骤由 updateLive 打勾
function miniSteps(steps,altText){
    let n=0;
    let items=steps.filter(function(step){
        return step.type!=="plant";
    }).map(function(step){
        let num=NUMS.charAt(n++) || String(n);
        let text=step.type==="refill"
            ? "补水 "+refillTime(step)
            : step.title+" "+clock(step.at)+(step.final ? " → 剩 "+fmtDur(step.remain) : "");
        return "<li data-end='"+stepEnd(step)+"' data-num='"+num+"'><span class='mark'>"+num+"</span>"+text+"</li>";
    });
    if(altText){
        items.push("<li class='alt'>"+altText+"</li>");
    }
    return "<ul class='mini'>"+items.join("")+"</ul>";
}



// =====================
// 数据存取：APP 里存到 SharedPreferences，浏览器里存到 localStorage
// =====================

const STORE={ farms:"farmList", plans:"waterPlans", strategies:"waterStrategies", settings:"settings" };

let farms=[];
let plans=[];
let strategies=[];
let settings={};

function storageLoad(key){
    try{
        if(window.AndroidStorage){
            return AndroidStorage.load(key) || "";
        }
        return localStorage.getItem("qiqiFarm."+key) || "";
    }
    catch(e){
        return "";
    }
}

function storageSave(key,value){
    try{
        if(window.AndroidStorage){
            AndroidStorage.save(key,value);
        }
        else{
            localStorage.setItem("qiqiFarm."+key,value);
        }
    }
    catch(e){
    }
}

function loadList(key,isValid){
    let list;
    try{
        list=JSON.parse(storageLoad(key) || "[]");
    }
    catch(e){
        list=[];
    }
    if(!Array.isArray(list)){
        return [];
    }
    return list.filter(function(item){
        return item && typeof item==="object" && isValid(item);
    });
}

function saveList(key,list){
    storageSave(key,JSON.stringify(list));
}

function saveSettings(){
    storageSave(STORE.settings,JSON.stringify(settings));
}

function isNum(value){
    return typeof value==="number" && isFinite(value);
}

function hasValidSteps(item){
    return Array.isArray(item.steps) && item.steps.length>0 && item.steps.every(function(step){
        return step && (isNum(step.at) || (isNum(step.from) && isNum(step.to)));
    });
}

function loadAll(){
    // 农场列表沿用旧版的存储格式
    farms=loadList(STORE.farms,function(item){
        return item.finishTime && !isNaN(Number(item.finishTime));
    });
    let idAdded=false;
    farms.forEach(function(item){
        // 兼容旧版本数据，自动补充唯一ID
        if(!item.id){
            item.id=Date.now()+Math.random();
            idAdded=true;
        }
    });
    if(idAdded){
        saveList(STORE.farms,farms);
    }

    plans=loadList(STORE.plans,hasValidSteps);
    strategies=loadList(STORE.strategies,hasValidSteps);

    try{
        settings=JSON.parse(storageLoad(STORE.settings) || "{}") || {};
    }
    catch(e){
        settings={};
    }
    if(!(settings.target>0)){
        settings.target=DEFAULT_TARGET;
    }
}

// 三种记录各自的列表，删除时按 kind 找到对应的那个
const LISTS={
    farm:{ key:STORE.farms, get:function(){ return farms; }, set:function(v){ farms=v; } },
    plan:{ key:STORE.plans, get:function(){ return plans; }, set:function(v){ plans=v; } },
    strategy:{ key:STORE.strategies, get:function(){ return strategies; }, set:function(v){ strategies=v; } }
};

function allRecords(){
    let recs=[];
    Object.keys(LISTS).forEach(function(kind){
        LISTS[kind].get().forEach(function(item){
            recs.push({ kind:kind, item:item });
        });
    });
    return recs;
}

let homeFilter="all";
let openIds={};

function greetIndex(hour){
    return hour<5 ? 0 : hour<11 ? 1 : hour<13 ? 2 : hour<18 ? 3 : 4;
}

// 作物显示用的信息；农场里存的是 CROPS 的 label，旧数据可能是别的写法
function cropInfo(crop){
    crop=String(crop || "");
    if(crop.indexOf("英雄")>=0){
        return { key:"hero", emoji:"🌸", name:"英雄作物", bg:"b-blush", total:CROPS.hero.total };
    }
    if(crop.indexOf("经济")>=0){
        return { key:"eco", emoji:"🍑", name:"经济作物", bg:"b-peach", total:CROPS.eco.total };
    }
    return { key:"", emoji:"🌱", name:crop, bg:"b-sage", total:0 };
}

// 排序分组：0 已成熟，1 还有事要做（按时间先后），2 全部浇完
function recordState(rec,now){
    if(rec.kind==="farm"){
        let finish=Number(rec.item.finishTime);
        return finish<=now ? { group:0, time:finish, ripe:true } : { group:1, time:finish };
    }
    let next=nextStep(rec.item.steps,now);
    if(next){
        return { group:1, time:stepEnd(next), next:next };
    }
    return { group:2, time:-stepEnd(lastStep(rec.item.steps)) };
}

function compareRec(a,b){
    return a.state.group-b.state.group || a.state.time-b.state.time;
}

// 记录的状态有变化（成熟了、走到下一步了）时才需要重建小院
function homeKey(now){
    return [new Date(now).getHours(),homeFilter].concat(allRecords().map(function(rec){
        let state=recordState(rec,now);
        let tail=state.ripe ? "R" : state.next ? rec.item.steps.indexOf(state.next) : "D";
        if(rec.kind==="plan" && isNum(rec.item.ripeAt) && rec.item.ripeAt<now){
            tail+="r";
        }
        return rec.kind+rec.item.id+tail;
    })).join("|");
}

function recKey(rec){
    return rec.kind+":"+rec.item.id;
}

function delBtn(rec){
    return "<button type='button' class='more' data-del='"+escapeHtml(recKey(rec))+"' aria-label='删除'>⋯</button>";
}

function recTop(rec,tagClass,tagText){
    return "<div class='rec-top'>"+
        "<b class='rec-name'>"+escapeHtml(rec.item.name)+"</b>"+
        "<span class='kind "+tagClass+"'>"+tagText+"</span>"+
        delBtn(rec)+
    "</div>";
}

function detailHtml(rec){
    let it=rec.item;
    let plan=rec.kind==="plan";
    let meta=plan
        ? (isNum(it.plantTime) ? "🌱 种下 "+clock(it.plantTime,true) : "")
        : (isNum(it.calcTime) ? "🧭 算于 "+clock(it.calcTime,true) : "");
    let alt=isNum(it.alt) ? "不补水："+clock(it.alt)+(plan ? " 浇第二次" : " 浇一次")+" → 剩 "+fmtDur(it.target) : "";
    let ripe=plan && isNum(it.ripeAt) ? "之后不再浇水："+clock(it.ripeAt,true)+" 成熟" : "";
    return "<div class='detail'>"+
        (meta ? "<div class='detail-meta'>"+meta+"</div>" : "")+
        miniSteps(it.steps,alt)+
        (ripe ? "<div class='detail-meta'>"+ripe+"</div>" : "")+
    "</div>";
}

function stepperHtml(rec,next,now){
    let it=rec.item;
    let items=it.steps.map(function(step){
        let cls=step===next ? "next" : stepEnd(step)<now-MINUTE ? "done" : "";
        return "<li class='"+cls+"'>"+stepLabel(step)+"</li>";
    });
    if(rec.kind==="plan" && isNum(it.ripeAt)){
        items.push("<li class='"+(it.ripeAt<now ? "done" : "")+"'>成熟</li>");
    }
    return "<ol class='mini-steps'>"+items.join("")+"</ol>";
}

// 卡片上"下一步做什么"
function nextHtml(rec,next){
    let it=rec.item;
    if(!next){
        return "<div class='rec-main done-text'>✓ 已全部浇完</div>"+
            "<div class='rec-sub'>"+(rec.kind==="plan" && isNum(it.ripeAt) ? clock(it.ripeAt,true)+" 成熟" : "按计划浇完啦")+"</div>";
    }
    if(next.type==="refill" && next.from!==undefined){
        return "<div class='rec-main'><span class='clock'>"+rangeHtml(next.from,next.to)+"</span> 补水</div>"+
            "<div class='rec-sub' data-live='range' data-style='long' data-from='"+next.from+"' data-to='"+next.to+"'></div>";
    }
    let what=next.type==="refill" ? "补水" : next.title;
    let tail=next.type==="refill" ? "别让水干" : "浇后剩 "+fmtDur(next.remain);
    return "<div class='rec-main'><span class='clock'>"+timeHtml(next.at)+"</span> "+what+"</div>"+
        "<div class='rec-sub'><span data-live='at' data-t='"+next.at+"'></span> · "+tail+"</div>";
}

function cardHtml(rec,now){
    let it=rec.item;
    if(rec.kind==="farm"){
        let crop=cropInfo(it.crop);
        let finish=Number(it.finishTime);
        let ripe=!!rec.state.ripe;
        return "<article class='rec"+(ripe ? " ripe" : "")+"'>"+
            "<div class='badge-ic "+(ripe ? "b-sage" : crop.bg)+"'>"+crop.emoji+"</div>"+
            "<div class='rec-body'>"+
                recTop(rec,ripe ? "k-sage" : "k-apricot","成熟")+
                "<div class='rec-main' data-live='grow' data-t='"+finish+"'></div>"+
                (crop.total ? "<div class='bar'><i data-bar='"+finish+"' data-total='"+crop.total*MINUTE+"'></i></div>" : "")+
                "<div class='rec-sub'>"+clock(finish,true)+" 成熟 · "+escapeHtml(crop.name)+"</div>"+
            "</div>"+
        "</article>";
    }
    let next=rec.state.next || null;
    let plan=rec.kind==="plan";
    let open=!!openIds[recKey(rec)];
    return "<article class='rec"+(next ? "" : " finished")+(open ? " open" : "")+"' data-key='"+escapeHtml(recKey(rec))+"'>"+
        "<div class='badge-ic "+(plan ? "b-water" : "b-honey")+"'>"+(plan ? "💧" : "🧭")+"</div>"+
        "<div class='rec-body'>"+
            recTop(rec,plan ? "k-water" : "k-honey",plan ? "浇水" : "策略")+
            nextHtml(rec,next)+
            stepperHtml(rec,next,now)+
            "<button type='button' class='toggle'>"+(open ? "收起" : "全部步骤")+"</button>"+
            detailHtml(rec)+
        "</div>"+
    "</article>";
}

// 顶部大卡片：最近要做的一件事
function heroHtml(rec){
    let it=rec.item;
    let name="<b>"+escapeHtml(it.name)+"</b>";
    let start,title,time,sub,pill,art;
    let then="";
    if(rec.kind==="farm"){
        let crop=cropInfo(it.crop);
        let finish=Number(it.finishTime);
        start=finish;
        title="等 "+name+" 成熟";
        time=timeHtml(finish);
        sub=escapeHtml(crop.name)+" · 一直把水补满的话";
        pill="<span data-live='grow' data-style='rich' data-t='"+finish+"'></span>";
        art="<span class='hero-art hero-emoji'>"+crop.emoji+"</span>";
    }
    else{
        let step=rec.state.next;
        start=stepStart(step);
        title="给 "+name+" "+(step.type==="refill" ? "补水" : "浇水");
        if(step.from!==undefined){
            time=rangeHtml(step.from,step.to);
            sub="这段时间里随时补一次，"+clock(step.to)+" 水会干";
            pill="<span data-live='range' data-style='rich' data-from='"+step.from+"' data-to='"+step.to+"'></span>";
        }
        else{
            time=timeHtml(step.at);
            sub=step.type==="refill" ? "按时补水，别让水干" : (step.title!=="浇水" ? step.title+" · " : "")+"浇后剩 "+fmtDur(step.remain);
            pill="<span data-live='at' data-style='rich' data-t='"+step.at+"'></span>";
        }
        let after=it.steps[it.steps.indexOf(step)+1];
        if(after){
            then="接着 "+clock(stepStart(after))+" "+(after.type==="refill" ? "补水" : after.title);
        }
        else if(rec.kind==="plan" && isNum(it.ripeAt)){
            then="之后 "+clock(it.ripeAt,true)+" 成熟";
        }
        art="<svg class='hero-art'><use href='#can'/></svg>";
    }
    let open=!!openIds[recKey(rec)];
    return "<section class='hero"+(open ? " open" : "")+"'>"+
        art+
        "<div class='hero-eyebrow' data-live='now' data-t='"+start+"'></div>"+
        delBtn(rec)+
        "<div class='hero-title'>"+title+"</div>"+
        "<div class='hero-time'>"+time+"</div>"+
        "<div class='hero-sub'>"+sub+"</div>"+
        "<div class='hero-foot'><span class='hero-pill'>"+pill+"</span>"+(then ? "<span class='hero-then'>"+then+"</span>" : "")+"</div>"+
        (rec.kind==="farm" ? "" : "<button type='button' class='toggle' data-toggle='"+escapeHtml(recKey(rec))+"'>"+(open ? "收起" : "全部步骤")+"</button>"+detailHtml(rec))+
    "</section>";
}

function chipsHtml(counts,total){
    return "<div class='chips'>"+[
        ["all","全部",total],
        ["farm","成熟",counts.farm],
        ["plan","浇水",counts.plan],
        ["strategy","策略",counts.strategy]
    ].filter(function(chip){
        return chip[2]>0;
    }).map(function(chip){
        return "<button type='button' class='chip"+(homeFilter===chip[0] ? " on" : "")+"' data-filter='"+chip[0]+"'>"+chip[1]+"<i>"+chip[2]+"</i></button>";
    }).join("")+"</div>";
}

function renderHome(){
    let now=Date.now();
    let d=new Date(now);
    let recs=allRecords();
    recs.forEach(function(rec){
        rec.state=recordState(rec,now);
    });
    let counts={ farm:farms.length, plan:plans.length, strategy:strategies.length };
    let kinds=Object.keys(counts).filter(function(kind){
        return counts[kind]>0;
    }).length;
    if(kinds<2 || (homeFilter!=="all" && counts[homeFilter]===0)){
        homeFilter="all";
    }

    let ripe=recs.filter(function(rec){ return rec.state.ripe; }).length;
    let pending=recs.filter(function(rec){ return rec.state.group===1; }).length;
    document.getElementById("h-hello").textContent=GREETINGS[greetIndex(d.getHours())];
    document.getElementById("h-today").innerHTML=(d.getMonth()+1)+"月"+d.getDate()+"日 周"+"日一二三四五六".charAt(d.getDay())+" · "+(
        ripe>0 ? "<b>"+ripe+" 块田可以收啦</b>"
        : pending>0 ? pending+" 件事在等你"
        : recs.length>0 ? "都忙完啦，歇一会儿吧"
        : "今天也要开开心心种田呀"
    );

    let html;
    if(recs.length===0){
        html=EMPTY_HTML;
    }
    else{
        // 筛选后最急的一件放成大卡片，其余的排在下面
        let shown=recs.filter(function(rec){
            return homeFilter==="all" || rec.kind===homeFilter;
        }).sort(compareRec);
        let hero=shown.find(function(rec){
            return rec.state.group===1;
        });
        html=(hero ? heroHtml(hero) : "")+
            (kinds>=2 ? chipsHtml(counts,recs.length) : "")+
            shown.filter(function(rec){
                return rec!==hero;
            }).map(function(rec){
                return cardHtml(rec,now);
            }).join("");
    }
    document.getElementById("h-body").innerHTML=html;
    homeKeyNow=homeKey(now);
    updateLive(now);
}



// =====================
// 每秒刷新的文字
// =====================

function liveText(el,now){
    let type=el.getAttribute("data-live");
    let style=el.getAttribute("data-style") || "";
    let dur=style==="rich" ? durHtml : fmtDur;
    let t=Number(el.getAttribute("data-t"));
    if(type==="grow"){
        let left=t-now;
        if(style==="rich"){
            return left>0 ? "还剩 "+countdownHtml(left) : "已经成熟啦";
        }
        return left>0 ? countdownHtml(left)+" 后成熟" : "已经成熟啦，快去收获 🎉";
    }
    if(type==="range"){
        let from=Number(el.getAttribute("data-from"));
        let to=Number(el.getAttribute("data-to"));
        if(now<from-MINUTE){
            return "还有 "+dur(Math.ceil((from-now)/MINUTE))+" 开始";
        }
        if(now<=to){
            let left="还剩 "+dur(Math.floor((to-now)/MINUTE));
            return style==="rich" ? left : style==="long" ? "现在可以补 · "+left : "现在可以补";
        }
        return "已过";
    }
    if(type==="at"){
        let diff=t-now;
        if(diff>MINUTE){
            return "还有 "+dur(Math.ceil(diff/MINUTE));
        }
        return diff>-MINUTE ? "就是现在" : "已过";
    }
    // type==="now"：大卡片上的小标题
    let isNow=now>=t-MINUTE;
    el.classList.toggle("now",isNow);
    return isNow ? "现在就要做" : "下一件事";
}

// 只改文字和样式，不重建按钮
function updateLive(now){
    document.querySelectorAll("[data-live]").forEach(function(el){
        el.innerHTML=liveText(el,now);
    });

    document.querySelectorAll("[data-bar]").forEach(function(el){
        let left=Number(el.getAttribute("data-bar"))-now;
        let done=1-left/Number(el.getAttribute("data-total"));
        el.style.width=(Math.min(Math.max(done,0),1)*100).toFixed(1)+"%";
    });

    // 计算结果里的步骤：做完的打勾，下一步加光圈
    document.querySelectorAll(".path.live").forEach(function(list){
        let foundNext=false;
        list.querySelectorAll("li").forEach(function(li){
            let type=li.getAttribute("data-type");
            let past=Number(li.getAttribute("data-end"))<now-MINUTE;
            let isNext=!past && !foundNext && type!=="plant" && type!=="ripe";
            foundNext=foundNext || isNext;
            li.classList.toggle("done",past);
            li.classList.toggle("next",isNext);
        });
    });

    document.querySelectorAll(".mini li[data-end]").forEach(function(li){
        let past=Number(li.getAttribute("data-end"))<now-MINUTE;
        li.classList.toggle("passed",past);
        li.querySelector(".mark").textContent=past ? "✓" : li.getAttribute("data-num");
    });
}

function refreshLive(){
    let now=Date.now();
    if(homeKey(now)!==homeKeyNow){
        renderHome();
        return;
    }
    updateLive(now);
}



// =====================
// 计算结果
// =====================

function saveBtn(){
    return "<div class='save'><button type='button' class='btn ghost' data-save><svg><use href='#i-home'/></svg>存进小院</button></div>";
}

function warnHtml(text){
    return "<div class='card'><div class='warn'><b>做不到</b><br>"+text+"</div></div>";
}

function stat(label,min){
    return "<div class='stat'><span>"+label+"</span>"+durHtml(min)+"</div>";
}

function maturityResultHtml(result){
    let crop=cropInfo(result.crop.label);
    let finish=roundMin(result.finishTime);
    return "<div class='ticket'>"+
        "<div class='ticket-top'>"+
            "<div class='t-meta'><span class='t-tag t-"+crop.key+"'>"+crop.emoji+" "+crop.name+"</span><span>按 "+hhmm(result.now)+" 算的</span></div>"+
            "<div class='t-label'>一直把水补满的话，最快</div>"+
            "<div class='t-big'><small>"+dayLabel(finish)+"</small><b>"+hhmm(finish)+"</b><small>成熟</small></div>"+
            "<div class='t-count'>还要 "+durHtml(result.fastest)+"</div>"+
        "</div>"+
        "<div class='cut'></div>"+
        "<div class='stats'>"+
            stat("💧 浇水缩短",result.reduce)+
            stat("🌱 浇水后剩",result.after)+
            stat("⚡ 最快成熟",result.fastest)+
        "</div>"+
    "</div>"+
    saveBtn();
}

// 田间小路上的一步
function pathItem(step){
    let icon="<svg><use href='#can'/></svg>";
    let title=step.title;
    let time=timeHtml(step.at);
    let badge="<em class='badge' data-live='at' data-t='"+step.at+"'></em>";
    let detail;
    if(step.type==="plant"){
        icon="🌱";
        title="种下";
        badge="";
        detail="自动浇满水 · 剩 "+fmtDur(step.remain);
    }
    else if(step.type==="refill"){
        icon="💧";
        title="补水";
        if(step.from!==undefined){
            time=rangeHtml(step.from,step.to);
            badge="<em class='badge' data-live='range' data-from='"+step.from+"' data-to='"+step.to+"'></em>";
            detail="这段时间里随时补一次，"+clock(step.to)+" 水会干";
        }
        else{
            detail="按时补水，别让水干";
        }
    }
    else{
        detail="浇后剩 "+(step.final ? "<span class='goal'>"+fmtDur(step.remain)+"</span>" : fmtDur(step.remain));
    }
    return "<li data-type='"+step.type+"' data-end='"+stepEnd(step)+"'>"+
        "<span class='node'><i class='ic'>"+icon+"</i></span>"+
        "<div class='pc'>"+
            "<div class='p-row'><b>"+title+"</b><time>"+time+"</time></div>"+
            "<p>"+detail+badge+"</p>"+
        "</div>"+
    "</li>";
}

function wateringResultHtml(record){
    if(!record.possible){
        return warnHtml("第一次浇水后剩 <span class='nw'>"+fmtDur(record.firstAfter)+"</span>，目标剩余时间不能比这个长");
    }
    let waters=record.steps.filter(function(step){ return step.type==="water"; }).length;
    let refills=record.steps.filter(function(step){ return step.type==="refill"; }).length;
    let html="<div class='card'>"+
        "<div class='card-h'>浇水计划<span>共浇 "+waters+" 次"+(refills ? " · 补水 "+refills+" 次" : "")+"</span></div>"+
        "<ol class='path live'>"+
            record.steps.map(pathItem).join("")+
            "<li data-type='ripe' data-end='"+record.ripeAt+"'>"+
                "<span class='node'><i class='ic'>🌾</i></span>"+
                "<div class='pc'>"+
                    "<div class='p-row'><b>成熟</b><time>"+timeHtml(record.ripeAt)+"</time></div>"+
                    "<p>之后不再浇水的话</p>"+
                "</div>"+
            "</li>"+
        "</ol>";
    if(isNum(record.alt)){
        html+="<div class='note'>不补水的话："+clock(record.alt)+" 浇第二次，浇后也剩 "+fmtDur(record.target)+"</div>";
    }
    return html+"</div>"+saveBtn();
}

function strategyResultHtml(record){
    if(!record.possible){
        return warnHtml("现在浇水后只剩 <span class='nw'>"+fmtDur(record.afterNow)+"</span>，已经低于目标 <span class='nw'>"+fmtDur(record.target)+"</span>");
    }
    let more=record.afterNow-record.target;
    let even=Math.round(more)<=0;
    let share=even ? 100 : Math.round(record.target/record.afterNow*100);
    let html="<div class='compare'>"+
        "<div class='compare-meta'>按 "+hhmm(record.calcTime)+" 算的</div>"+
        "<div class='compare-t'>现在就浇的话，浇后剩 "+durHtml(record.afterNow)+"</div>"+
        "<div class='cbar'>"+
            "<span class='a"+(share<22 ? " tight" : "")+"' style='width:"+share+"%'>目标 "+fmtDur(record.target)+"</span>"+
            (even ? "" : "<span class='b"+(share>78 ? " tight" : "")+"' style='width:"+(100-share)+"%'>多 "+fmtDur(more)+"</span>")+
        "</div>"+
        "<div class='compare-f'>"+(even ? "正好就是目标，按下面的时间浇就行 ↓" : "比目标多 "+fmtDur(more)+"，靠「晚点再浇」用掉 ↓")+"</div>"+
    "</div>";
    let refill=record.steps.length>1;
    let alt=isNum(record.alt);
    html+="<div class='plan main'><div class='plan-h'>"+
        (refill ? "<b>方案一 · 先补水</b><span>最后浇水更早</span>" : "<b>浇水方案</b><span>等的这段时间水不会干，不用补水</span>")+
        (alt ? "<span class='rib'>推荐</span>" : "")+
        "</div>"+
        "<ol class='path live'>"+record.steps.map(pathItem).join("")+"</ol>"+
    "</div>";
    if(alt){
        html+="<div class='plan alt'><div class='plan-h'><b>方案二 · 不补水</b><span>只浇一次</span></div>"+
            "<ol class='path'>"+pathItem({ type:"water", title:"浇水", at:record.alt, remain:record.target, final:true })+"</ol>"+
        "</div>";
    }
    return html+saveBtn();
}

function showResult(id,html,scroll){
    let box=document.getElementById(id);
    box.innerHTML=html;
    box.hidden=false;
    box.classList.remove("result");
    void box.offsetWidth;
    box.classList.add("result");
    refreshLive();
    if(scroll){
        box.scrollIntoView({ block:"nearest", behavior:"smooth" });
    }
}



// =====================
// 输入和提示
// =====================

// 读取"小时 + 分钟"两个输入框，返回总分钟数；空着按 0 算，填了负数返回 NaN
function readMinutes(hourId,minId){
    let h=Number(document.getElementById(hourId).value)||0;
    let m=Number(document.getElementById(minId).value)||0;
    if(h<0||m<0){
        return NaN;
    }
    return h*60+m;
}

// 检查剩余时间和水分时间，有问题时返回出错的输入框（remain / water）和提示文字
function checkRemainWater(crop,remain,water,remainName,canSwitchCrop){
    if(isNaN(remain)){
        return { field:"remain", msg:"时间不能填负数" };
    }
    if(isNaN(water)){
        return { field:"water", msg:"时间不能填负数" };
    }
    if(remain<=0){
        return { field:"remain", msg:"请输入"+remainName };
    }
    if(remain>plantRemain(crop)){
        return { field:"remain", msg:crop.name+"的"+remainName+"最多 "+fmtDur(plantRemain(crop))+(canSwitchCrop ? "，请检查作物类型或输入" : "，请检查输入") };
    }
    if(water>crop.maxWater){
        return { field:"water", msg:crop.name+"的水分最多 "+fmtDur(crop.maxWater)+(canSwitchCrop ? "，请检查作物类型或水分时间" : "，请检查水分时间") };
    }
    return null;
}

// 输错时把那一格标红，原因写在正下方
function showError(field,msg){
    clearError(field);
    let box=document.createElement("div");
    box.className="err-msg";
    box.textContent="⚠️ "+msg;
    field.querySelector(".inp-row,.inp,.trow,.goal-row").insertAdjacentElement("afterend",box);
    field.classList.add("err");
    field.scrollIntoView({ block:"nearest", behavior:"smooth" });
}

function clearError(field){
    field.classList.remove("err");
    let box=field.querySelector(".err-msg");
    if(box){
        box.remove();
    }
}

function clearErrors(scope){
    scope.querySelectorAll(".field.err").forEach(clearError);
}

function page(name){
    return document.querySelector(".page[data-page='"+name+"']");
}

function readName(id){
    let input=document.getElementById(id);
    let name=input.value.trim();
    if(name===""){
        showError(input.closest(".field"),"请输入农场名称");
        input.focus();
    }
    return name;
}

let toastTimer=null;

function showToast(text,goHome){
    let toast=document.getElementById("toast");
    toast.innerHTML=escapeHtml(text)+(goHome ? "<button type='button' data-go='home'>去看看 →</button>" : "");
    toast.hidden=true;
    void toast.offsetWidth;
    toast.hidden=false;
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){
        toast.hidden=true;
    },2600);
}

// 农场名称下面的"最近"：按保存时间从新到旧，取不重复的 3 个
function renderRecent(){
    let seen={};
    let names=[];
    allRecords().map(function(rec){
        return rec.item;
    }).sort(function(a,b){
        return Number(b.id)-Number(a.id);
    }).forEach(function(item){
        let name=String(item.name || "").trim();
        if(name && !seen[name]){
            seen[name]=true;
            names.push(name);
        }
    });
    names=names.slice(0,3);
    document.querySelectorAll(".recent").forEach(function(box){
        box.hidden=names.length===0;
        box.innerHTML="<span>最近</span>"+names.map(function(name){
            return "<button type='button' data-name='"+escapeHtml(name)+"'>"+escapeHtml(name)+"</button>";
        }).join("");
    });
}

function renderTarget(){
    document.querySelectorAll(".target-value").forEach(function(el){
        el.innerHTML=durHtml(settings.target);
    });
}

function renderAll(){
    renderTarget();
    renderRecent();
    renderHome();
}



// =====================
// 三个计算页
// =====================

function selectedCrop(){
    let on=document.querySelector("#m-crop .crop.on");
    return CROPS[on ? on.getAttribute("data-crop") : "hero"];
}

function renderCropHints(){
    let crop=selectedCrop();
    document.getElementById("m-remain-max").textContent="最多 "+fmtDur(plantRemain(crop));
    document.getElementById("m-water-max").textContent="最多 "+fmtDur(crop.maxWater);
}

// 计算成熟时间：输入有误时标出来并返回 null
function calcMaturityInput(scroll){
    let form=page("maturity");
    clearErrors(form);
    let crop=selectedCrop();
    let remain=readMinutes("m-remain-h","m-remain-m");
    let water=readMinutes("m-water-h","m-water-m");
    let error=checkRemainWater(crop,remain,water,"剩余成熟时间",true);
    if(error){
        showError(form.querySelector("[data-field='"+error.field+"']"),error.msg);
        return null;
    }
    let result=calcMaturity(crop,remain,water);
    result.crop=crop;
    result.now=Date.now();
    result.finishTime=result.now+Math.round(result.fastest*MINUTE);
    showResult("m-result",maturityResultHtml(result),scroll);
    return result;
}

function saveMaturity(){
    let name=readName("m-name");
    if(name===""){
        return;
    }
    // 保存前按当前输入重新计算，避免改了输入却存进旧结果
    let result=calcMaturityInput(false);
    if(!result){
        return;
    }
    farms.push({
        id:Date.now(),
        name:name,
        crop:result.crop.label,
        finishTime:result.finishTime
    });
    saveList(STORE.farms,farms);
    renderAll();
    showToast("已存进小院",true);
}


let wateringShown=false;

function calcWateringInput(scroll){
    let form=page("watering");
    clearErrors(form);
    let value=document.getElementById("w-plant").value;
    let plantTime=value ? new Date(value).getTime() : NaN;
    if(isNaN(plantTime)){
        showError(form.querySelector("[data-field='plant']"),"请选择种下时间");
        return null;
    }
    let record=buildWatering(plantTime,settings.target);
    showResult("w-result",wateringResultHtml(record),scroll);
    wateringShown=true;
    return record;
}

function saveWatering(){
    let name=readName("w-name");
    if(name===""){
        return;
    }
    let record=calcWateringInput(false);
    if(!record){
        return;
    }
    if(!record.possible){
        showToast("按现在的目标剩余时间算不出浇水时间，没法保存");
        return;
    }
    record.id=Date.now();
    record.name=name;
    plans.push(record);
    saveList(STORE.plans,plans);
    renderAll();
    showToast("已存进小院",true);
}


let strategyShown=false;

function calcStrategyInput(scroll){
    let form=page("strategy");
    clearErrors(form);
    let remain=readMinutes("s-remain-h","s-remain-m");
    let water=readMinutes("s-water-h","s-water-m");
    let error=checkRemainWater(CROPS.hero,remain,water,"当前剩余时间",false);
    if(error){
        showError(form.querySelector("[data-field='"+error.field+"']"),error.msg);
        return null;
    }
    let record=buildStrategy(Date.now(),remain,water,settings.target);
    showResult("s-result",strategyResultHtml(record),scroll);
    strategyShown=true;
    return record;
}

function saveStrategy(){
    let name=readName("s-name");
    if(name===""){
        return;
    }
    let record=calcStrategyInput(false);
    if(!record){
        return;
    }
    if(!record.possible){
        showToast("现在已经达不到目标剩余时间，没法保存");
        return;
    }
    record.id=Date.now();
    record.name=name;
    strategies.push(record);
    saveList(STORE.strategies,strategies);
    renderAll();
    showToast("已存进小院",true);
}


function showTab(name){
    if(!page(name)){
        name="home";
    }
    document.querySelectorAll(".page").forEach(function(el){
        el.hidden=el.getAttribute("data-page")!==name;
    });
    document.querySelectorAll(".tabbar button").forEach(function(btn){
        btn.classList.toggle("on",btn.getAttribute("data-tab")===name);
    });
    window.scrollTo(0,0);
    // 记住上次用的功能，下次打开直接回到这里
    if(settings.tab!==name){
        settings.tab=name;
        saveSettings();
    }
}

function closeTargetEditors(){
    document.querySelectorAll(".target-box").forEach(function(box){
        box.querySelector(".goal-edit").hidden=true;
        box.querySelector(".target-toggle").textContent="修改";
        clearErrors(box);
    });
}

function changeTarget(editor){
    let h=Number(editor.querySelector(".target-h").value)||0;
    let m=Number(editor.querySelector(".target-m").value)||0;
    let target=Math.round(h*60+m);
    if(h<0||m<0||target<=0){
        showError(editor,"请输入正确的目标剩余时间");
        return;
    }
    if(target>plantRemain(CROPS.hero)){
        showError(editor,"目标剩余时间最多 "+fmtDur(plantRemain(CROPS.hero)));
        return;
    }
    settings.target=target;
    saveSettings();
    closeTargetEditors();
    renderTarget();

    // 已经算出来的结果是按旧目标算的，提示重新计算
    let tip="<div class='tip'>🎯 目标改成了 "+fmtDur(target)+"，点「算一算」重新算</div>";
    if(wateringShown){
        showResult("w-result",tip,false);
        wateringShown=false;
    }
    if(strategyShown){
        showResult("s-result",tip,false);
        strategyShown=false;
    }
}


let pendingDelete=null;

function openDelete(key){
    let i=key.indexOf(":");
    let kind=key.slice(0,i);
    let id=key.slice(i+1);
    let item=LISTS[kind] && LISTS[kind].get().find(function(it){
        return String(it.id)===id;
    });
    if(!item){
        return;
    }
    pendingDelete={ kind:kind, id:id };
    document.getElementById("sheet-title").textContent="删除「"+item.name+"」？";
    document.getElementById("sheet").hidden=false;
}

function closeSheet(){
    pendingDelete=null;
    document.getElementById("sheet").hidden=true;
}



// =====================
// 按钮
// =====================

document.querySelectorAll(".tabbar button").forEach(function(btn){
    btn.onclick=function(){
        showTab(btn.getAttribute("data-tab"));
    };
});

document.querySelectorAll("#m-crop .crop").forEach(function(btn){
    btn.onclick=function(){
        document.querySelectorAll("#m-crop .crop").forEach(function(b){
            b.classList.toggle("on",b===btn);
        });
        renderCropHints();
        clearErrors(page("maturity"));
    };
});

document.getElementById("m-calc").onclick=function(){ calcMaturityInput(true); };
document.getElementById("w-calc").onclick=function(){ calcWateringInput(true); };
document.getElementById("s-calc").onclick=function(){ calcStrategyInput(true); };

// 结果每次重建，"存进小院"按钮用事件委托
[["m-result",saveMaturity],["w-result",saveWatering],["s-result",saveStrategy]].forEach(function(pair){
    document.getElementById(pair[0]).addEventListener("click",function(e){
        if(e.target.closest("[data-save]")){
            pair[1]();
        }
    });
});

document.getElementById("w-now").onclick=function(){
    document.getElementById("w-plant").value=toInputTime(Date.now());
    clearError(page("watering").querySelector("[data-field='plant']"));
};

document.querySelectorAll(".target-toggle").forEach(function(btn){
    btn.onclick=function(){
        let editor=btn.closest(".target-box").querySelector(".goal-edit");
        let show=editor.hidden;
        closeTargetEditors();
        if(show){
            editor.hidden=false;
            btn.textContent="取消";
            editor.querySelector(".target-h").value=Math.floor(settings.target/60);
            editor.querySelector(".target-m").value=settings.target%60;
        }

document.querySelectorAll(".target-ok").forEach(function(btn){
    btn.onclick=function(){
        changeTarget(btn.closest(".goal-edit"));
    };
});

// "最近"里的名字点一下就填进去
document.querySelectorAll(".recent").forEach(function(box){
    box.addEventListener("click",function(e){
        let btn=e.target.closest("[data-name]");
        if(!btn){
            return;
        }
        let input=document.getElementById(box.getAttribute("data-for"));
        input.value=btn.getAttribute("data-name");
        clearError(input.closest(".field"));
    });
});

// 小院里的按钮都用事件委托，列表刷新后也不会失效
document.getElementById("h-body").addEventListener("click",function(e){
    let del=e.target.closest("[data-del]");
    if(del){
        openDelete(del.getAttribute("data-del"));
        return;
    }
    let chip=e.target.closest("[data-filter]");
    if(chip){
        homeFilter=chip.getAttribute("data-filter");
        renderHome();
        return;
    }
    let toggle=e.target.closest("[data-toggle],[data-key]");
    if(toggle){
        let key=toggle.getAttribute("data-toggle") || toggle.getAttribute("data-key");
        openIds[key]=!openIds[key];
        renderHome();
    }
});

// "去看看" / "去算一块"
document.addEventListener("click",function(e){
    let go=e.target.closest("[data-go]");
    if(go){
        document.getElementById("toast").hidden=true;
        showTab(go.getAttribute("data-go"));
    }
});

document.querySelectorAll("#sheet [data-close]").forEach(function(el){
    el.onclick=closeSheet;
});

document.getElementById("sheet-ok").onclick=function(){
    if(!pendingDelete){
        return;
    }
    let list=LISTS[pendingDelete.kind];
    let id=pendingDelete.id;
    list.set(list.get().filter(function(item){
        return String(item.id)!==id;
    }));
    saveList(list.key,list.get());
    delete openIds[pendingDelete.kind+":"+id];
    closeSheet();
    renderAll();
    showToast("已删除");
};

// 改了输入就把那一格的错误提示收起来
document.addEventListener("input",function(e){
    let field=e.target.closest(".field.err");
    if(field){
        clearError(field);
    }
});

// 输入时隐藏底部标签栏，免得被键盘顶上来挡住输入框
document.addEventListener("focusin",function(e){
    if(e.target.matches("input")){
        document.body.classList.add("typing");
    }
});
document.addEventListener("focusout",function(){
    document.body.classList.remove("typing");
});


loadAll();
document.getElementById("w-plant").value=toInputTime(Date.now());
renderCropHints();
document.getElementById("s-remain-max").textContent="最多 "+fmtDur(plantRemain(CROPS.hero));
document.getElementById("s-water-max").textContent="最多 "+fmtDur(CROPS.hero.maxWater);
renderAll();
showTab(settings.tab);

// 过了零点，"今天/明天"要重新显示
let renderedDate=new Date().toDateString();
setInterval(function(){
    if(new Date().toDateString()!==renderedDate){
        renderedDate=new Date().toDateString();
        renderAll();
    }
    refreshLive();
},1000);
