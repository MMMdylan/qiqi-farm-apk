<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>琪琪宝贝专属偷菜助手</title>


<style>

body{

    margin:0;

    padding:20px 0;

    min-height:100vh;

    overflow-x:hidden;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    font-family:"Microsoft YaHei";

    background:
    linear-gradient(
    #b7e6ff,
    #dff5b8
    );

    font-size:16px;

}



.container{

    width:90%;

    max-width:430px;

    margin:20px auto;

    padding:10px;

}



/* 顶部标题 */

.title{

    text-align:center;

    font-size:24px;

    font-weight:bold;

    color:#4b7f32;

    margin-top:15px;

    white-space:nowrap;

}





.card{

    background:white;

    border-radius:25px;

    padding:20px;

    margin-top:18px;

    box-shadow:

    0 5px 15px rgba(0,0,0,0.15);

}





label{

    display:block;

    margin-top:15px;

    font-size:24px;

    font-weight:bold;

    color:#557c38;

}





input,select,button{

    width:100%;

    box-sizing:border-box;

    padding:12px;

    margin-top:8px;

    border-radius:12px;

    border:2px solid #b8d98b;

    font-size:16px;

    background:white;

}





.timeBox{

    display:flex;

    gap:10px;

}



.timeBox input{

    width:50%;

}





button{

    width:100%;

    height:60px;

    margin-top:20px;

    border-radius:18px;

    border:none;

    background:#72b84b;

    color:white;

    font-size:25px;

    font-weight:bold;

}



button:active{

    background:#5c9c39;

}





.result{

    font-size:24px;

    line-height:2;

    color:#555;

}





.highlight{

    color:#e67e22;

    font-size:32px;

    font-weight:bold;

}





/* 农场列表 */

.farmListItem{

    background:#f8ffe8;

    border-radius:18px;

    padding:15px;

    margin-top:15px;

    border:2px solid #b8d98b;

}





.farmName{

    font-size:26px;

    color:#4b7f32;

    font-weight:bold;

}





.smallText{

    font-size:20px;

    margin-top:8px;

}





.deleteBtn{

    background:#e87979;

    margin-top:12px;

    height:45px;

    font-size:20px;

}





.empty{

    text-align:center;

    color:#999;

    padding:20px;

}



</style>


</head>


<body>


<div class="container">



<div class="title">

🌱 琪琪宝贝专属偷菜助手 🌱

</div>






<div class="card">


<label>

🌾 农场名称

</label>


<input id="farmName"

placeholder="例如：Aura.情">






<label>

🌱 作物类型

</label>


<select id="type">


<option value="hero">

🌸 英雄作物

</option>


<option value="eco">

🍑 经济作物

</option>


</select>






<label>

⏳ 剩余成熟时间

</label>


<div class="timeBox">

<input 
id="timeHour"
type="number"
inputmode="numeric"
placeholder="小时"
min="0">

<input 
id="timeMin"
type="number"
inputmode="numeric"
placeholder="分钟"
min="0"
max="59">

</div>






<label>

💧 剩余水分维持时间

</label>


<div class="timeBox">

<input 
id="waterHour"
type="number"
inputmode="numeric"
placeholder="小时"
min="0">

<input 
id="waterMin"
type="number"
inputmode="numeric"
placeholder="分钟"
min="0"
max="59">

</div>






<button onclick="calc()">

💧 计算成熟时间

</button>




<button onclick="saveFarm()">

🌾 保存农场

</button>



</div>







<div class="card result" id="result">

等待计算...

</div>







<div class="card">


<h3>

🌱 农场列表

</h3>


<div id="farmList">


<div class="empty">

暂无农场

</div>


</div>


</div>




<script>

// =====================
// 初始化时间选择
// =====================


function initSelect(id,max){

    let obj=document.getElementById(id);


    for(let i=0;i<=max;i++){

        obj.innerHTML +=

        "<option value='"+i+"'>"+i+"</option>";

    }

}



// =====================
// 数据
// =====================


let farms=[];


let currentResult=null;





//读取保存数据

let oldData="";


if(window.AndroidStorage){

    oldData = AndroidStorage.loadData();

}
else{

    oldData = localStorage.getItem("qiqiFarm");

}



if(oldData){


    try{


        farms=JSON.parse(oldData);



        // 清理异常数据

        farms=

        farms.filter(function(item){


            return item.finishTime &&

            !isNaN(Number(item.finishTime));


        });



    }

    catch(e){


        farms=[];


    }


}



saveData();







// =====================
// 时间格式
// =====================


function format(min){


    min=Math.round(min);



    let h=Math.floor(min/60);



    let m=min%60;



    if(h>0){


        return h+"小时"+m+"分钟";


    }



    return m+"分钟";


}








// =====================
// 剩余倒计时
// =====================


function getRemainTime(time){



    time=Number(time);



    if(!time || isNaN(time)){


        return "数据错误";


    }





    let diff=

    time-Date.now();






    if(diff<=0){


        return "已经成熟 🌱";


    }







    let total=

    Math.floor(diff/1000);






    let h=

    Math.floor(total/3600);






    let m=

    Math.floor(

    (total%3600)/60

    );






    let s=

    total%60;






    return (

    h.toString().padStart(2,"0")

    +"小时"+

    m.toString().padStart(2,"0")

    +"分钟"+

    s.toString().padStart(2,"0")

    +"秒"

    );



}








// =====================
// 日期+时间显示
// =====================


function getFinishClock(time){



    let d=

    new Date(Number(time));





    let month=

    d.getMonth()+1;





    let day=

    d.getDate();





    let h=

    d.getHours()

    .toString()

    .padStart(2,"0");






    let m=

    d.getMinutes()

    .toString()

    .padStart(2,"0");







    return (

    month+

    "月"+

    day+

    "日 "+

    h+

    ":"+

    m

    );



}









// =====================
// 核心计算
// =====================


function calc(){





    let T=


    (Number(timeHour.value)||0)*60+

    (Number(timeMin.value)||0);








    let W=


    (Number(waterHour.value)||0)*60+

    (Number(waterMin.value)||0);









    let maxWater;

    let reduce;









    if(type.value=="hero"){



        //英雄作物

        maxWater=640;


        reduce=160;



    }

    else{



        //经济作物

        maxWater=320;


        reduce=80;



    }









    // 当前浇水缩短


    let nowReduce=



    reduce*

    (maxWater-W)

    /

    maxWater;









    // 浇水后剩余


    let after=



    T-nowReduce;






    if(after<0){


        after=0;


    }









    // 最快成熟


    let fastest=



    after/

    (1+reduce/maxWater);









    // 最终成熟时间戳


    let finishTime=



    Date.now()+



    Math.round(

    fastest*60*1000

    );










    currentResult={



        reduce:nowReduce,


        after:after,


        fastest:fastest,


        finishTime:Number(finishTime)



    };









    document.getElementById("result").innerHTML=






    "💧 当前浇水缩短：<br>"+



    "<span class='highlight'>"+

    format(nowReduce)+

    "</span>"+





    "<br><br>🌱 浇水后剩余：<br>"+



    "<span class='highlight'>"+

    format(after)+

    "</span>"+





    "<br><br>⚡ 最快成熟时间：<br>"+



    "<span class='highlight'>"+

    format(fastest)+

    "</span>"+





    "<br><br>🕒 预计成熟：<br>"+



    "<span class='highlight'>"+

    getFinishClock(finishTime)+

    "</span>";



}









// =====================
// 保存农场
// =====================


function saveFarm(){



    if(!currentResult){


        alert("请先计算成熟时间");


        return;


    }






    let name=


    document.getElementById("farmName")

    .value.trim();







    if(name==""){


        alert("请输入农场名称");


        return;


    }








    let farm={


        id:Date.now(),


        name:name,



        crop:



        type.value=="hero"

        ?

        "🌸英雄作物"

        :

        "🍑经济作物",





        finishTime:



        Number(currentResult.finishTime)



    };








    farms.push(farm);



    saveData();



    showFarmList();



    alert("保存成功");



}








// =====================
// 保存数据
// =====================


function saveData(){


    let data = JSON.stringify(farms);


    if(window.AndroidStorage){

        AndroidStorage.saveData(data);

    }
    else{

        localStorage.setItem(
            "qiqiFarm",
            data
        );

    }


}

// =====================
// 显示农场列表
// =====================


function showFarmList(){


    farms.sort(function(a,b){

        return Number(a.finishTime)-Number(b.finishTime);

    });


    let box=

    document.getElementById("farmList");





    if(farms.length===0){


        box.innerHTML=

        "<div class='empty'>暂无农场</div>";


        return;


    }






    box.innerHTML="";







    farms.forEach(function(farm,index){



        box.innerHTML +=



        "<div class='farmListItem'>"+






        "<div class='farmName'>"+

        "🌾 "+farm.name+

        "</div>"+






        "<div class='smallText'>"+

        "作物："+farm.crop+

        "</div>"+






        "<div class='smallText'>"+

        "剩余："+

        getRemainTime(farm.finishTime)+

        "</div>"+






        "<div class='smallText'>"+

        "🕒 预计成熟："+

        getFinishClock(farm.finishTime)+

        "</div>"+






        "<button class='deleteBtn' onclick='deleteFarm("+farm.id+")'>"+

        "删除农场"+

        "</button>"+





        "</div>";



    });



}







// =====================
// 删除农场
// =====================


function deleteFarm(id){



    if(confirm("确定删除这个农场吗？")){


        farms = farms.filter(function(item){

            return item.id != id;

        });


        saveData();



        showFarmList();



    }



}







// =====================
// 自动刷新倒计时
// =====================


setInterval(function(){



    showFarmList();



},1000);






// 页面打开立即刷新

showFarmList();

</script>


</body>


</html>
